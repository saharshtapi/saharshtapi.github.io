# Portfolio data — shared by the homepage and the blog section
portfolio:
  name: Saharsh Agrawal
  role: Security Researcher
  tagline: >-
    I hunt for vulnerabilities, dissect malware campaigns, and turn what I learn into tooling
    other people can use.
  email: saharshtapi@gmail.com
  # Threat research articles published with the research team at Loginsoft
  blog_articles:
    - title: "Taming the Storm: Understanding and Mitigating the Consequences of CVE-2023-27350"
      url: https://research.loginsoft.com/threat-research/taming-the-storm-understanding-and-mitigating-the-consequences-of-cve-2023-27350/
      date: May 23, 2023
      tags:
        - CVE-2023-27350
        - Cl0p
        - LockBit
        - TrueBot
      excerpt: >-
        The world of cybersecurity is constantly evolving, with new threats emerging every day.
        One of the latest threats to emerge is the use of CVE-2023-27350 by threat actors to gain
        initial access to victim machines and servers. This vulnerability is found in the popular
        print management software, Papercut. In this blog post, we explore how the threat actors
        of Cl0p, Lockbit and Truebot malware are exploiting this vulnerability, and Osquery
        detections to safeguard from the risks it poses to businesses and organizations.
    - title: "IcedID Malware: Traversing Through its Various Incarnations"
      url: https://research.loginsoft.com/threat-research/icedid-malware-traversing-through-its-various-incarnations/
      date: May 02, 2023
      tags:
        - IcedID
        - Malware
        - Osquery
        - "Co-author: Bhargav"
      excerpt: >-
        IcedID, the notorious malware, is actively involved in several delivery campaigns,
        demonstrating versatility and adaptability. The latest IcedID variants indicate the
        malware's continuous evolution, and the need for robust cybersecurity measures.
    - title: "From Innocence to Malice: The OneNote Malware Campaign Uncovered"
      url: https://research.loginsoft.com/threat-research/from-innocence-to-malice-the-onenote-malware-campaign-uncovered/
      date: Mar 30, 2023
      tags:
        - Qakbot
        - AgentTesla
        - AsyncRAT
        - Redline
        - IcedID
        - Emotet
        - Quasar
      excerpt: >-
        OneNote has been highly cherished by Threat Actors (TAs) in recent months. Unfortunately,
        many malware distributors have taken notice and are now using OneNote to deliver malicious
        files to their victims. These actors attach malicious files to a page within OneNote and
        then share them with their targets as a .one file. The ONE file reaches its targets
        through phishing emails. Upon opening the attachment, the victim's computer is compromised.
    - title: "Aurora: The Dark Dawn and its Menacing Effects"
      url: https://research.loginsoft.com/threat-research/aurora-the-dark-dawn-and-its-menacing-effects/
      date: Mar 24, 2023
      tags:
        - Aurora
        - Stealer
        - Malware
        - Redline
      excerpt: >-
        Aurora Stealer, a non-friendly program in your neighborhood, is developed in Go-lang. The
        malware was developed for threat actors to steal victims' sensitive data. Since its
        initial release, there have been many adaptations of the malware. It started as a botnet
        having info-steaker capabilities but currently it is a full-time info-stealer which is
        being sold by the threat actor labelled Cheshire on Russian speaking dark-net forums
        mentioned by cybersecurity firm Sekoia.

collections:
  Projects:
    output: true
    permalink: :permalink
  cves:
    output: true
    permalink: /CVES/:title/

