---
layout: default1
---
{% include section-hero.html cmd="ls ./cves" %}

<div class="pf-grid pf-grid-2">
  {% for cve in site.cves | sort: "date" | reverse %}
    <article class="pf-card">
      <h2 class="pf-card-title"><i class="fas fa-bug"></i> <a href="{{ cve.permalink | relative_url }}">{{ cve.title }}</a></h2>
      <p class="pf-meta-line">
        {{ cve.date | date: "%b %-d, %Y" }}
        {% for tag in cve.tags %}<span class="pf-chip">{{ tag }}</span>{% endfor %}
      </p>
      <a class="pf-card-link" href="{{ cve.permalink | relative_url }}">Read the analysis <i class="fas fa-arrow-right"></i></a>
    </article>
  {% endfor %}
</div>
