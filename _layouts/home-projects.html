---
layout: default1
---
{% include section-hero.html cmd="ls ./projects" %}

<div class="pf-grid pf-grid-3">
  {% for project in site.Projects %}
    <article class="pf-card">
      <h2 class="pf-card-title"><i class="fas fa-project-diagram"></i> <a href="{{ project.permalink }}" target="_blank" rel="noopener">{{ project.title }}</a></h2>
      <p class="pf-meta-line">
        {{ project.date | date: "%b %-d, %Y" }}
        {% for tag in project.tags %}<span class="pf-chip">{{ tag }}</span>{% endfor %}
      </p>
      <a class="pf-card-link" href="{{ project.permalink }}" target="_blank" rel="noopener">Open project <i class="fas fa-arrow-right"></i></a>
    </article>
  {% endfor %}
</div>
