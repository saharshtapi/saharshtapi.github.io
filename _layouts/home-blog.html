---
layout: default1
---
{% include section-hero.html cmd="ls ./writing" %}

<div class="pf-grid pf-grid-2">
  {% for article in site.portfolio.blog_articles %}
    <article class="pf-card pf-card-flat">
      <h2 class="pf-card-title">
        <a href="{{ article.url }}" target="_blank" rel="noopener">{{ article.title }}</a>
      </h2>
      <p class="pf-meta-line">
        {{ article.date }}
        {% for tag in article.tags %}<span class="pf-chip">{{ tag }}</span>{% endfor %}
      </p>
      <p>{{ article.excerpt }}</p>
      <a class="pf-card-link" href="{{ article.url }}" target="_blank" rel="noopener">Read article <i class="fas fa-arrow-right"></i></a>
    </article>
  {% endfor %}
</div>
