---
layout: default1
---
{% include section-hero.html cmd="ls ./ctf" %}

<div class="pf-grid pf-grid-3">
  {% for post in site.posts %}
    <article class="pf-card">
      <h2 class="pf-card-title"><i class="fas fa-terminal"></i> <a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
      <p class="pf-meta-line">
        {{ post.date | date: "%b %-d, %Y" }}
        {% for tag in post.tags %}<span class="pf-chip">{{ tag }}</span>{% endfor %}
      </p>
      <a class="pf-card-link" href="{{ post.url | relative_url }}">Read walkthrough <i class="fas fa-arrow-right"></i></a>
    </article>
  {% endfor %}
</div>
